<div class="update-batch-page">
  <div class="update-batch-form-container">
    <h2 class="update-batch-title">Update Batch</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <!-- Batch Name -->
      <div class="row">
        <div class="col-md-12 form-group mb-3">
          <label for="batch_name" class="form-label">Batch Name</label>
          <input id="batch_name" formControlName="batch_name" type="text" name="batch_name" class="form-control" [placeholder]="batch?.batch_name" required>
        </div>
      </div>

      <!-- Branch -->
<div class="row">
  <div class="col-md-12 form-group mb-3">
    <label for="branch_name" class="form-label">Branch  Name</label>
    <select id="branch_name" formControlName="branch" class="form-control" required>
      <option value="" disabled selected>Select Branch</option>
      <option *ngFor="let branch of branches" [ngValue]="branch.branch_id">{{ branch.branch_name }}</option>
    </select>
  </div>
</div>
      <!-- Course Name -->
      <div class="row">
        <div class="col-md-12 form-group mb-3">
          <label for="course_name" class="form-label">Course  Name</label>
          <select id="course_name" formControlName="course" class="form-control" required>
            <option value="" disabled selected>Select Course</option>
            <option *ngFor="let course of courses" [ngValue]="course.course_id">{{ course.course_name }}</option>
          </select>
        </div>
      </div>


     <div class="button-row">

  <button
    [disabled]="!form.valid"
    class="update-button"
    type="submit">
    Update Batch
  </button>

  <button
    type="button"
    class="back-button"
    (click)="goBack()">
    Back
  </button>

</div>
    </form>

  </div>
</div>
<app-sidenav></app-sidenav>
