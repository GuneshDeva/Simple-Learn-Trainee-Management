<div class="my-5">
  <h2 class="add-course-title">Add Course</h2>
  <div class="mx-auto w-25" style="max-width: 100%;">

      <form [formGroup]="form" (ngSubmit)="saveCourse()">
          <!-- Course Name -->
          <div class="row">
              <div class="col-md-12 form-group mb-3">
                  <label for="courseName" class="form-label">Course Name</label>
                  <input id="courseName" formControlName="course_name" type="text" name="courseName" class="form-control"
                    placeholder="Course Name"
                    required >

<div class="validation-error" *ngIf="form.get('course_name')?.touched && form.get('course_name')?.invalid" >
  <span *ngIf="form.get('course_name')?.hasError('required')">
    Course Name is required.
  </span>
  <span *ngIf="form.get('course_name')?.hasError('pattern')">
    Please enter a valid course name.
  </span>
</div>
              </div>
          </div>

          <!-- Course Fee -->
          <div class="row">
              <div class="col-md-12 form-group mb-3">
                  <label for="courseFee" class="form-label">Course Fee</label>
                  <input id="courseFee" formControlName="course_fee" type="text" name="courseFee"
                       class="form-control" placeholder="Course Fee" required >

<div  class="validation-error" *ngIf="form.get('course_fee')?.touched && form.get('course_fee')?.invalid" >
  <span *ngIf="form.get('course_fee')?.hasError('required')">
    Course Fee is required.
  </span>

  <span *ngIf="form.get('course_fee')?.hasError('pattern')">
    Please enter numbers only for Course Fee.
  </span>
</div>
              </div>
          </div>

          <!-- Course Duration -->
          <div class="row">
              <div class="col-md-12 form-group mb-3">
                  <label for="courseDuration" class="form-label">Course Duration</label>
                  <input id="courseDuration" formControlName="course_duration" type="text" name="courseDuration"
                        class="form-control" placeholder="Course Duration (e.g. 6 Months)" required>

<div
  class="validation-error"
  *ngIf="form.get('course_duration')?.touched && form.get('course_duration')?.invalid" >
  <span *ngIf="form.get('course_duration')?.hasError('required')">
    Course Duration is required.
  </span>

  <span *ngIf="form.get('course_duration')?.hasError('pattern')">
    Enter duration like 6 Months, 1 Year, or 8 Weeks.
  </span>
</div>
              </div>
          </div>

          <!-- Buttons -->
          <div class="row">
              <div class="col-md-4 form-group">
                  <button class="btn btn-secondary w-90" type="button" (click)="goBack()">Back</button>
              </div>
              <div class="col-md-4 form-group">
                  <input [disabled]="!form.valid" class="btn btn-primary w-110" type="submit" value="Add Course">
              </div>
              <div class="col-md-4 form-group">
                  <input class="btn btn-primary w-90" type="reset" value="Reset">
              </div>
          </div>
      </form>
  </div>
</div>
<app-sidenav></app-sidenav>
