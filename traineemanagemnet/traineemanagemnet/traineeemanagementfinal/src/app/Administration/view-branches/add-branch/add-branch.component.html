
<mat-card
  color="primary"
  class="card mat-elevation-z8"
  style="height: 300px; width: 400%; display: flex; justify-content: center; align-items: center;"
>
  <form
    [formGroup]="myForm"
    (ngSubmit)="onSubmit()"
    (reset)="onReset()"
  >

    <mat-card-content>

      <h2 class="branch-title">
        <b>ADD BRANCH</b>
      </h2>

      <!-- Select Location -->
      <div class="form-group">
        <div class="row">

          <div class="col-75 form-group labelname">
            <label for="selectedLocation">
              Select Location
            </label>
          </div>

          <div class="col form-group">
            <mat-select
              class="form-control"
              formControlName="selectedLocation"
              placeholder="Available Locations"
            >
              <mat-option
                *ngFor="let loc of locations"
                [value]="loc.location_id"
              >
                {{ loc.city }}
              </mat-option>
            </mat-select>
          </div>

        </div>
      </div>


      <!-- Branch Name -->
      <div class="row form-group">

        <div class="col-75 form-group labelname">
          <label for="branch_name">
            Branch Name
          </label>
        </div>

        <div class="col-75 form-group">

          <input
            class="form-control"
            type="text"
            formControlName="branch_name"
            placeholder="Enter Branch"
            (input)="convertToUpperCase($event)"
          />

          <div class="invalid-feedback">
            <div>Field required</div>
          </div>

        </div>

      </div>


      <!-- Buttons -->
      <div class="button-row">

        <button
          class="btn btn-success btn-sm submit"
          type="submit"
        >
          Create Branch
        </button>

        <button
          class="btn btn-warning btn-sm"
          type="reset"
        >
          Clear
        </button>

        <button
          class="btn btn-secondary btn-sm"
          id="button"
          type="button"
          (click)="goBack()"
        >
          Go Back
        </button>

      </div>

    </mat-card-content>

  </form>
</mat-card>

<app-Administration></app-Administration>
